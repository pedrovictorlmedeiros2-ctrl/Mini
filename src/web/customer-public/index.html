<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlantic Host — Painel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  :root {
    --bg: #0b0d13; --bg2: #10131b; --card: #161a24; --border: #262b3a;
    --text: #e8eaed; --muted: #8b93a7; --accent: #5865F2; --accent2: #7289da;
    --ok: #3ba55d; --warn: #faa81a; --err: #ed4245;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  a { color: var(--accent2); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: .55rem .9rem; font-weight: 600; cursor: pointer; font-size: .82rem;
    transition: background .15s;
  }
  button:hover { background: #4752c4; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { background: var(--card); }
  button.danger { background: var(--err); } button.danger:hover { background: #c53639; }
  button.success { background: var(--ok); } button.success:hover { background: #2f8a4d; }
  button.sm { padding: .32rem .55rem; font-size: .72rem; }
  input, select {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: .5rem .65rem; font-size: .82rem; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  /* ── Login ─────────────────────────────────────────────── */
  #login-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #161a2c 0%, var(--bg) 60%);
  }
  .login-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 2.5rem; width: 380px; text-align: center;
  }
  .login-card h1 { font-size: 1.4rem; margin: .25rem 0 .1rem; }
  .login-card .brand { font-size: 2.2rem; }
  .login-card p { color: var(--muted); font-size: .88rem; margin-bottom: 1.75rem; }
  .discord-btn {
    display: inline-flex; align-items: center; gap: .5rem; width: 100%; justify-content: center;
    background: #5865F2; padding: .75rem 1rem; font-size: .92rem;
  }

  /* ── App shell ─────────────────────────────────────────── */
  #app { display: none; height: 100vh; }
  #app.ready { display: flex; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  .sidebar .brand-row {
    padding: 1.1rem 1.1rem .8rem; display: flex; align-items: center; gap: .5rem;
    font-weight: 800; font-size: 1.05rem; border-bottom: 1px solid var(--border);
  }
  .sidebar .brand-row span.accent { color: var(--accent2); }
  .bot-list { flex: 1; overflow-y: auto; padding: .6rem; }
  .bot-item {
    padding: .6rem .7rem; border-radius: 9px; cursor: pointer; margin-bottom: .3rem;
    display: flex; align-items: center; gap: .55rem; font-size: .85rem;
  }
  .bot-item:hover { background: var(--card); }
  .bot-item.active { background: var(--card); box-shadow: inset 2px 0 0 var(--accent); }
  .bot-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .bot-item .dot.online { background: var(--ok); } .bot-item .dot.offline { background: var(--muted); }
  .bot-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-row {
    padding: .8rem 1rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: .55rem;
  }
  .user-row img { width: 28px; height: 28px; border-radius: 50%; }
  .user-row .uname { flex: 1; font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-row button { padding: .3rem .5rem; font-size: .7rem; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    padding: .9rem 1.3rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .topbar h2 { margin: 0; font-size: 1.05rem; }
  .topbar .sub { color: var(--muted); font-size: .78rem; }
  .status-badge { font-size: .72rem; padding: .2rem .55rem; border-radius: 999px; border: 1px solid var(--border); }
  .status-badge.online { color: var(--ok); border-color: var(--ok); }
  .status-badge.offline { color: var(--muted); }
  .status-badge.suspended { color: var(--err); border-color: var(--err); }
  .actions-row { display: flex; gap: .4rem; }

  .tabs { display: flex; gap: .2rem; padding: 0 1.3rem; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; color: var(--muted); padding: .65rem .9rem; font-size: .82rem;
    border-bottom: 2px solid transparent; border-radius: 0; font-weight: 600;
  }
  .tab-btn:hover { color: var(--text); background: none; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-content { flex: 1; overflow: hidden; display: none; min-height: 0; }
  .tab-content.active { display: flex; flex-direction: column; }

  .empty-state { margin: auto; text-align: center; color: var(--muted); padding: 2rem; }

  /* Console */
  #console-output {
    flex: 1; overflow-y: auto; background: #060709; padding: .9rem 1.1rem;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .78rem; line-height: 1.5;
  }
  #console-output .line { white-space: pre-wrap; word-break: break-word; }
  #console-output .line.stderr { color: #ff8686; }

  /* Files / editor */
  .files-layout { flex: 1; display: flex; min-height: 0; }
  .file-tree { width: 240px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: .6rem; }
  .file-tree .row {
    padding: .38rem .5rem; border-radius: 6px; cursor: pointer; font-size: .82rem;
    display: flex; align-items: center; gap: .4rem; overflow: hidden;
  }
  .file-tree .row:hover { background: var(--card); }
  .file-tree .row.active { background: var(--card); }
  .file-tree .row span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor-tabs { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .editor-tab {
    padding: .5rem .9rem; font-size: .78rem; border-right: 1px solid var(--border);
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: .4rem; color: var(--muted);
  }
  .editor-tab.active { color: var(--text); background: var(--card); }
  .editor-tab .close { opacity: .6; }
  .editor-tab .close:hover { opacity: 1; color: var(--err); }
  .CodeMirror { flex: 1; height: 100% !important; font-size: .85rem; }
  .editor-toolbar { padding: .5rem .8rem; border-top: 1px solid var(--border); display: flex; gap: .5rem; justify-content: flex-end; }

  /* Env vars */
  #env-tab { padding: 1.1rem 1.3rem; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; font-weight: 600; }
  .env-form { display: flex; gap: .5rem; margin-top: 1rem; max-width: 560px; }

  #toast {
    position: fixed; bottom: 1.2rem; right: 1.2rem; background: var(--card); border: 1px solid var(--border);
    padding: .7rem 1rem; border-radius: 9px; font-size: .82rem; opacity: 0; transform: translateY(8px);
    transition: all .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok { border-color: var(--ok); }
  #toast.fail { border-color: var(--err); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="brand">🌊</div>
    <h1>Atlantic Host</h1>
    <p>Entre com sua conta do Discord para gerenciar seus bots.</p>
    <a class="discord-btn" href="/auth/login" style="text-decoration:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.83 19.83 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
      Entrar com Discord
    </a>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand-row">🌊 Atlantic<span class="accent">Host</span></div>
    <div class="bot-list" id="bot-list"></div>
    <div class="user-row" id="user-row"></div>
  </aside>

  <main class="main">
    <div id="no-bot-selected" class="empty-state" style="margin:auto;">Selecione um bot na lista ao lado.</div>

    <div id="bot-view" style="display:none; flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="topbar">
        <div>
          <h2 id="bot-name">—</h2>
          <div class="sub"><span id="bot-status" class="status-badge">—</span> · <span id="bot-lang"></span></div>
        </div>
        <div class="actions-row">
          <button id="btn-start" class="success sm">▶ Iniciar</button>
          <button id="btn-restart" class="secondary sm">↻ Reiniciar</button>
          <button id="btn-stop" class="danger sm">■ Parar</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="console">Console</button>
        <button class="tab-btn" data-tab="files">Arquivos</button>
        <button class="tab-btn" data-tab="env">Variáveis</button>
      </div>

      <div class="tab-content active" id="tab-console">
        <div id="console-output"></div>
      </div>

      <div class="tab-content" id="tab-files">
        <div class="files-layout">
          <div class="file-tree" id="file-tree"></div>
          <div class="editor-area">
            <div class="editor-tabs" id="editor-tabs"></div>
            <div id="editor-empty" class="empty-state">Abra um arquivo na árvore ao lado.</div>
            <textarea id="editor-host" style="display:none;"></textarea>
            <div class="editor-toolbar" id="editor-toolbar" style="display:none;">
              <button id="btn-save" class="success sm">💾 Salvar (Ctrl+S)</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content" id="tab-env">
        <div id="env-tab">
          <table>
            <thead><tr><th>Variável</th><th>Valor</th><th></th></tr></thead>
            <tbody id="env-body"></tbody>
          </table>
          <form class="env-form" id="env-form">
            <input id="env-key" placeholder="CHAVE" required>
            <input id="env-value" placeholder="valor" required>
            <button type="submit" class="sm">Adicionar</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script>
'use strict';

// ── util ──────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ok = true) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'fail');
  setTimeout(() => { el.className = ''; }, 2800);
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (res.status === 401) { showLogin(); throw new Error('not_authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `Erro ${res.status}`);
  return data;
}

// ── auth / bootstrap ──────────────────────────────────────────────────────
let currentUser = null;
let bots = [];
let selectedBot = null;

function showLogin() {
  $('login-screen').style.display = 'flex';
  $('app').classList.remove('ready');
}

async function boot() {
  try {
    const me = await api('/api/me');
    currentUser = me;
    $('login-screen').style.display = 'none';
    $('app').classList.add('ready');
    renderUserRow();
    await loadBots();
  } catch {
    showLogin();
  }
}

function renderUserRow() {
  // esc() aqui é defesa em profundidade: currentUser.id/avatar vêm da API do
  // Discord (hash hex normal), mas nunca inserimos dado de API externa direto
  // num atributo HTML sem escapar, mesmo que a origem seja "confiável" hoje.
  const avatarUrl = currentUser.avatar
    ? `https://cdn.discordapp.com/avatars/${esc(currentUser.id)}/${esc(currentUser.avatar)}.png?size=64`
    : 'https://cdn.discordapp.com/embed/avatars/0.png';
  $('user-row').innerHTML = `
    <img src="${avatarUrl}" alt="">
    <div class="uname">${esc(currentUser.username)}<br><span style="color:var(--muted);font-size:.7rem;">${esc(currentUser.plan_name || 'free')}</span></div>
    <button class="secondary" id="btn-logout">Sair</button>
  `;
  $('btn-logout').onclick = async () => {
    await api('/auth/logout', { method: 'POST' });
    window.location.reload();
  };
}

// ── lista de bots ─────────────────────────────────────────────────────────
async function loadBots() {
  const data = await api('/api/bots');
  bots = data.bots;
  renderBotList();
  if (bots.length && !selectedBot) selectBot(bots[0].id);
}

function renderBotList() {
  $('bot-list').innerHTML = bots.map(b => `
    <div class="bot-item ${selectedBot === b.id ? 'active' : ''}" data-id="${b.id}">
      <span class="dot ${b.status === 'online' ? 'online' : 'offline'}"></span>
      <span class="name">${esc(b.name)}</span>
    </div>
  `).join('') || '<div class="empty-state">Nenhum bot ainda.</div>';
  document.querySelectorAll('.bot-item').forEach(el => {
    el.onclick = () => selectBot(el.dataset.id);
  });
}

// ── seleção de bot ────────────────────────────────────────────────────────
let esConsole = null;
let openFiles = new Map(); // path -> { content, cm, dirty }
let activeFilePath = null;
let cm = null;

async function selectBot(id) {
  selectedBot = id;
  renderBotList();
  $('no-bot-selected').style.display = 'none';
  $('bot-view').style.display = 'flex';

  closeConsoleStream();
  openFiles.clear();
  activeFilePath = null;
  renderEditorTabs();

  const { bot } = await api(`/api/bots/${id}`);
  $('bot-name').textContent = bot.name;
  $('bot-lang').textContent = bot.language || '';
  const statusEl = $('bot-status');
  statusEl.textContent = bot.suspended ? 'suspenso' : bot.status;
  statusEl.className = 'status-badge ' + (bot.suspended ? 'suspended' : (bot.status === 'online' ? 'online' : 'offline'));

  $('btn-start').disabled = bot.status === 'online' || !!bot.suspended;
  $('btn-restart').disabled = bot.status !== 'online' || !!bot.suspended;
  $('btn-stop').disabled = bot.status !== 'online';

  await loadConsoleHistory(id);
  openConsoleStream(id);
  await loadFileTree(id, '');
  await loadEnv(id);
}

// ── ações ─────────────────────────────────────────────────────────────────
async function runAction(action) {
  try {
    await api(`/api/bots/${selectedBot}/${action}`, { method: 'POST' });
    toast(`Ação "${action}" enviada.`);
    setTimeout(() => selectBot(selectedBot), 1200);
  } catch (err) {
    toast(err.message, false);
  }
}
$('btn-start').onclick = () => runAction('start');
$('btn-stop').onclick = () => runAction('stop');
$('btn-restart').onclick = () => runAction('restart');

// ── tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'files' && cm) setTimeout(() => cm.refresh(), 50);
  };
});

// ── console (SSE) ─────────────────────────────────────────────────────────
async function loadConsoleHistory(id) {
  const { logs } = await api(`/api/bots/${id}/logs`);
  $('console-output').innerHTML = `<div class="line">${esc(logs)}</div>`;
  scrollConsoleToBottom();
}
function appendConsoleLine(payload) {
  const out = $('console-output');
  const div = document.createElement('div');
  div.className = 'line' + (payload.type === 'stderr' ? ' stderr' : '');
  div.textContent = payload.line;
  out.appendChild(div);
  while (out.children.length > 500) out.removeChild(out.firstChild);
  scrollConsoleToBottom();
}
function scrollConsoleToBottom() {
  const out = $('console-output');
  out.scrollTop = out.scrollHeight;
}
function openConsoleStream(id) {
  esConsole = new EventSource(`/api/bots/${id}/console/stream`);
  esConsole.onmessage = (evt) => {
    try { appendConsoleLine(JSON.parse(evt.data)); } catch { /* heartbeat/hello */ }
  };
  esConsole.onerror = () => { /* o navegador reconecta EventSource sozinho */ };
}
function closeConsoleStream() {
  if (esConsole) { esConsole.close(); esConsole = null; }
}

// ── arquivos / mini editor ────────────────────────────────────────────────
async function loadFileTree(id, subPath) {
  const { entries } = await api(`/api/bots/${id}/files?path=${encodeURIComponent(subPath)}`);
  const tree = $('file-tree');
  const rows = [];
  if (subPath) {
    const parent = subPath.split('/').slice(0, -1).join('/');
    rows.push(`<div class="row" data-nav="${esc(parent)}">⬅️ <span class="n">..</span></div>`);
  }
  for (const e of entries) {
    if (e.isDirectory) {
      rows.push(`<div class="row" data-nav="${esc(e.path)}">📁 <span class="n">${esc(e.name)}</span></div>`);
    } else {
      rows.push(`<div class="row" data-open="${esc(e.path)}">📄 <span class="n">${esc(e.name)}</span></div>`);
    }
  }
  tree.innerHTML = rows.join('') || '<div class="empty-state">Pasta vazia</div>';
  tree.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => loadFileTree(id, el.dataset.nav);
  });
  tree.querySelectorAll('[data-open]').forEach(el => {
    el.onclick = () => openFile(el.dataset.open);
  });
}

function modeForFile(name) {
  const ext = name.split('.').pop().toLowerCase();
  const map = {
    js: 'javascript', mjs: 'javascript', cjs: 'javascript', json: { name: 'javascript', json: true },
    py: 'python', html: 'htmlmixed', htm: 'htmlmixed', css: 'css', xml: 'xml',
    md: 'markdown', yml: 'yaml', yaml: 'yaml', sh: 'shell', env: 'shell',
  };
  return map[ext] || null;
}

async function openFile(filePath) {
  if (!openFiles.has(filePath)) {
    try {
      const { content } = await api(`/api/bots/${selectedBot}/files/content?path=${encodeURIComponent(filePath)}`);
      openFiles.set(filePath, { content, dirty: false });
    } catch (err) {
      toast(err.message, false);
      return;
    }
  }
  activeFilePath = filePath;
  renderEditorTabs();
  showEditorFor(filePath);
}

function renderEditorTabs() {
  const tabs = $('editor-tabs');
  tabs.innerHTML = [...openFiles.keys()].map(p => `
    <div class="editor-tab ${p === activeFilePath ? 'active' : ''}" data-path="${esc(p)}">
      <span class="n">${esc(p.split('/').pop())}${openFiles.get(p).dirty ? ' •' : ''}</span>
      <span class="close" data-close="${esc(p)}">✕</span>
    </div>
  `).join('');
  tabs.querySelectorAll('.editor-tab').forEach(el => {
    el.onclick = (evt) => {
      if (evt.target.dataset.close !== undefined) return;
      activeFilePath = el.dataset.path;
      renderEditorTabs();
      showEditorFor(activeFilePath);
    };
  });
  tabs.querySelectorAll('[data-close]').forEach(el => {
    el.onclick = (evt) => {
      evt.stopPropagation();
      const p = el.dataset.close;
      openFiles.delete(p);
      if (activeFilePath === p) activeFilePath = [...openFiles.keys()][0] || null;
      renderEditorTabs();
      if (activeFilePath) showEditorFor(activeFilePath);
      else {
        $('editor-empty').style.display = 'flex';
        $('editor-host').style.display = 'none';
        $('editor-toolbar').style.display = 'none';
        if (cm) cm.getWrapperElement().style.display = 'none';
      }
    };
  });
}

function ensureEditor() {
  if (cm) return cm;
  cm = CodeMirror.fromTextArea($('editor-host'), {
    lineNumbers: true,
    theme: 'dracula',
    tabSize: 2,
    viewportMargin: Infinity,
  });
  cm.setOption('extraKeys', {
    'Ctrl-S': saveActiveFile,
    'Cmd-S': saveActiveFile,
  });
  cm.on('change', () => {
    if (!activeFilePath) return;
    const f = openFiles.get(activeFilePath);
    if (!f) return;
    const newContent = cm.getValue();
    if (newContent !== f.content) { f.dirty = true; renderEditorTabs(); }
  });
  return cm;
}

function showEditorFor(filePath) {
  $('editor-empty').style.display = 'none';
  $('editor-host').style.display = 'block';
  $('editor-toolbar').style.display = 'flex';
  const editor = ensureEditor();
  editor.getWrapperElement().style.display = 'block';
  const f = openFiles.get(filePath);
  editor.setValue(f.content);
  const mode = modeForFile(filePath);
  editor.setOption('mode', mode || null);
  setTimeout(() => { editor.refresh(); editor.focus(); }, 30);
}

async function saveActiveFile() {
  if (!activeFilePath || !cm) return;
  const content = cm.getValue();
  try {
    await api(`/api/bots/${selectedBot}/files/content`, {
      method: 'PUT',
      body: JSON.stringify({ path: activeFilePath, content }),
    });
    const f = openFiles.get(activeFilePath);
    f.content = content;
    f.dirty = false;
    renderEditorTabs();
    toast('Arquivo salvo.');
  } catch (err) {
    toast(err.message, false);
  }
}
$('btn-save').onclick = saveActiveFile;

// ── variáveis de ambiente ─────────────────────────────────────────────────
async function loadEnv(id) {
  const { env } = await api(`/api/bots/${id}/env`);
  $('env-body').innerHTML = env.map(e => `
    <tr>
      <td><code>${esc(e.key)}</code></td>
      <td style="color:var(--muted)">${esc(e.value)}</td>
      <td><button class="secondary sm" data-del="${esc(e.key)}">Remover</button></td>
    </tr>
  `).join('') || '<tr><td colspan="3" style="color:var(--muted)">Nenhuma variável definida</td></tr>';
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      await api(`/api/bots/${selectedBot}/env/${encodeURIComponent(btn.dataset.del)}`, { method: 'DELETE' });
      loadEnv(selectedBot);
    };
  });
}
$('env-form').onsubmit = async (evt) => {
  evt.preventDefault();
  const key = $('env-key').value.trim().toUpperCase();
  const value = $('env-value').value;
  try {
    await api(`/api/bots/${selectedBot}/env`, { method: 'PUT', body: JSON.stringify({ key, value }) });
    $('env-key').value = ''; $('env-value').value = '';
    loadEnv(selectedBot);
  } catch (err) {
    toast(err.message, false);
  }
};

boot();
</script>
</body>
</html>
