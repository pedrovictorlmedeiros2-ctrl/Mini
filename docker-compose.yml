version: "3.9"
services:
  hosting-bot:
    build: .
    container_name: hosting-bot
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "3001:3001"
      - "80:80"
    volumes:
      - ./bots:/app/bots
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./src/database:/app/src/database
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HEALTH_PORT: 3001
      HOSTING_DB_PATH: /app/src/database/hosting.db
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
